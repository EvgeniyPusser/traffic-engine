[project]
name = "traffic-engine"
version = "0.1.0"
description = "Travel time as a distribution, not a number. Quantile forecasting on Caltrans PeMS data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evgenii Bogomazov-Pusser" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "typer>=0.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
traffic-engine = "traffic_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer читает подсказки из значений по умолчанию — это его штатный приём
"src/traffic_engine/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
